{# The widget grid. Rendered inside the full page, and also returned on its own when the filter form swaps it. #}
<section id="dashboard-area" class="dashboard-area">
  {# KPI row: one widget, five cards. #}
  <div class="widget widget-kpis"
       hx-get="{% url 'dashboard:partials_kpis' %}?{{ request.GET.urlencode }}"
       hx-trigger="load"
       hx-swap="innerHTML">
    <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
  </div>

  <div class="chart-grid">
    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_item_type' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>

    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_outlet' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>

    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_tier_size' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>

    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_fat_content' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>

    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_rating' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>

    <div class="card widget"
         hx-get="{% url 'dashboard:partials_chart_year' %}?{{ request.GET.urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
    </div>
  </div>

  <div class="card widget widget-top-items"
       hx-get="{% url 'dashboard:partials_top_items' %}?{{ request.GET.urlencode }}"
       hx-trigger="load"
       hx-swap="innerHTML">
    <div class="htmx-indicator widget-loading"><span class="spinner"></span>Loading…</div>
  </div>
</section>
