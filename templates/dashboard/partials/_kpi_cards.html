{% load dashboard_extras %}
<div class="kpi-grid">

  <div class="kpi-card kpi-green">
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
    </div>
    <div class="kpi-info">
      <span class="kpi-value">{{ kpis.total_sales|compact }}</span>
      <span class="kpi-label">Total Sales</span>
    </div>
  </div>

  <div class="kpi-card kpi-yellow">
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24" fill="rgba(0,0,0,0.6)">
        <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
      </svg>
    </div>
    <div class="kpi-info">
      <span class="kpi-value">{{ kpis.avg_sales|one_decimal }}</span>
      <span class="kpi-label">Avg Sales / Record</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--bk-green)">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
    </div>
    <div class="kpi-info">
      <span class="kpi-value">{{ kpis.avg_rating|one_decimal }}</span>
      <span class="kpi-label">Avg Rating</span>
    </div>
  </div>

  <div class="kpi-card kpi-dark">
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24" fill="white">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
    </div>
    <div class="kpi-info">
      <span class="kpi-value">{{ kpis.item_count|thousands }}</span>
      <span class="kpi-label">No. of Items</span>
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--bk-green)">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <div class="kpi-info">
      <span class="kpi-value">{{ kpis.outlet_count|thousands }}</span>
      <span class="kpi-label">Outlets</span>
    </div>
  </div>

</div>
